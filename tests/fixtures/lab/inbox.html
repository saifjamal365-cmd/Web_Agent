<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Team Chat - Lab Messenger</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px sans-serif; }
  .app { display: flex; height: 100vh; }
  nav { width: 220px; border-right: 1px solid #ccc; padding: 8px; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  header { padding: 8px; border-bottom: 1px solid #ccc; }
  #messages { flex: 1; overflow-y: auto; padding: 8px; }
  .msg { margin: 0 0 18px; }
  .who { font-weight: bold; }
  textarea { margin: 8px; height: 40px; }
</style>
<script src="lab.js"></script></head>
<body><div class="app">
<nav aria-label="Conversations">
  <a href="#">Lina Haddad</a><br><a href="#">Omar Saleh</a><br><a href="#">Project team</a>
</nav>
<main>
  <header><h2>Lina Haddad</h2></header>
  <div id="messages" role="region" aria-label="Message list"></div>
  <textarea aria-label="Message Lina Haddad" placeholder="Write a message"></textarea>
</main>
</div>
<script>
// A chat with no live updates: a message that arrives while the page is open shows only after a reload. On the
// first visit of a task Lina has not replied yet; from the second visit (a reload) her reply is there. Tests that
// the agent may read a page again after reloading it (24 Nov: a re-read after a reload was refused).
function labRun() {
  try { const x = new XMLHttpRequest(); x.open('GET', '/__run', false); x.send(); return x.status === 200 ? x.responseText : ''; }
  catch (e) { return ''; }
}
let st = {};
try {
  const run = labRun();
  st = JSON.parse(localStorage.getItem('inbox') || '{}');
  if ((st.run || '') !== run) st = {run, loads: 0};
  st.loads = (st.loads || 0) + 1;
  localStorage.setItem('inbox', JSON.stringify(st));
} catch (e) { st = {loads: 1}; }
if (window.labRecord) labRecord('inbox', {loads: st.loads});

const msgs = [
  ['Lina Haddad', 'Monday 9:14 AM', 'Thanks for the slides, I will read them before Thursday.'],
];
for (let i = 1; i <= 24; i++) {
  msgs.push([i % 2 ? 'Saif' : 'Lina Haddad', 'Monday ' + (10 + Math.floor(i / 6)) + ':' + String(10 + i).padStart(2, '0') + ' AM',
             'Earlier note ' + i + ' about the budget sheet, the supplier list and next month\'s plan.']);
}
msgs.push(['Saif', '20 min', 'Lina, what time works for you for the review meeting tomorrow?']);
if (st.loads >= 2) msgs.push(['Lina Haddad', 'Just now', '4:30 PM works for me. See you in room B.']);
const box = document.getElementById('messages');
for (const [who, when, text] of msgs) {
  const d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = `<div><span class="who">${who}</span> <span>${when}</span></div><div>${text}</div>`;
  box.appendChild(d);
}
box.scrollTop = box.scrollHeight;
</script>
</body></html>
