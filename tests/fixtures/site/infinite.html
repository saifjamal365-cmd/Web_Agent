<!doctype html>
<html><head><meta charset="utf-8"><title>Endless kettles - Test Shop</title></head>
<body>
<h1>Kettles</h1>
<ul id="list"></ul>
<script>
  // An endless list: 20 more items load each time the bottom comes into view (like a feed or some shops)
  let n = 0;
  function more() {
    const ul = document.getElementById('list');
    for (let i = 0; i < 20 && n < 100; i++) {
      n++;
      const li = document.createElement('li');
      li.style.height = '60px';
      li.textContent = `Kettle model ${n} with a long description of its size and colour - ${(10 + n * 1.5).toFixed(2)} JOD`;
      ul.appendChild(li);
    }
  }
  more();
  window.addEventListener('scroll', () => {
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 200) more();
  });
</script>
</body></html>
